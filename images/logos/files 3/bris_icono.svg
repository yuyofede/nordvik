<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bris – monograma</title>
  <desc>Monograma geométrico de la letra B, en azul y rojo noruego.</desc>

  <rect x="4" y="4" width="192" height="192" rx="28" fill="#00205B"/>

  <!-- Letra B construida con formas geometricas simples -->
  <rect x="58" y="50" width="22" height="100" fill="#FFFFFF"/>
  <path d="M80,50 h34 a26,26 0 0 1 0,52 h-34 z" fill="#FFFFFF"/>
  <path d="M80,102 h38 a26,26 0 0 1 0,48 h-38 z" fill="#FFFFFF"/>

  <!-- acento rojo, bloque de color desplazado -->
  <rect x="132" y="128" width="34" height="34" rx="4" fill="#BA0C2F"/>
</svg>
