<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Nordvik</title>
  <desc>Logotipo Nordvik: icono geométrico de fiordo en azul y rojo noruego, junto al nombre de la agencia.</desc>

  <!-- Icono: pico/fiordo geométrico, dos planos con corte diagonal (referencia sutil a la cruz nórdica desplazada) -->
  <g>
    <!-- plano azul (base) -->
    <polygon points="20,160 100,40 180,160" fill="#00205B"/>
    <!-- plano rojo (superpuesto, desplazado como la cruz de la bandera) -->
    <polygon points="60,160 120,60 180,160" fill="#BA0C2F"/>
    <!-- línea blanca fina que separa los planos, evocando el borde blanco de la cruz noruega -->
    <line x1="120" y1="60" x2="60" y2="160" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Wordmark -->
  <text x="215" y="115" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="2" fill="#00205B">NORDVIK</text>
  <text x="217" y="145" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="4" fill="#BA0C2F">AGENCIA DIGITAL</text>
</svg>
