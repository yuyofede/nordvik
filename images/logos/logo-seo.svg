<svg width="200" height="200" viewBox="0 0 1600 1300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Yuyo — Markedsføringsbyrå</title>
  <defs>
    <style>
      .word { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .tag  { font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; font-weight: 300; }
    </style>
  </defs>

  <rect width="1600" height="1300" fill="#FFFFFF"/>

  <!-- Mark: geometric "Y" monogram -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="1058.4" y1="246.4" x2="800" y2="444" stroke="#BA0C2F" stroke-width="87.4"/>
    <line x1="541.6" y1="246.4" x2="800" y2="444" stroke="#00205B" stroke-width="87.4"/>
    <line x1="800" y1="444" x2="800" y2="808.8" stroke="#00205B" stroke-width="87.4"/>
  </g>
  <rect x="772.9" y="416.9" width="54.2" height="54.2" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <text x="800" y="1085" class="word" font-size="150" letter-spacing="14" text-anchor="middle" fill="#11151F">YUYO</text>

  <!-- Tagline -->
  <text x="800" y="1175" class="tag" font-size="48" letter-spacing="20" text-anchor="middle" fill="#6E7684">MARKEDSFØRINGSBYRÅ</text>

  <!-- Accent rule -->
  <rect x="740" y="1206" width="120" height="4" fill="#BA0C2F"/>
</svg>
